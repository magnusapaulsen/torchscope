[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torchscope"
version = "0.1.0"
description = "See what a PyTorch network looks like and watch data flow through it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
examples = ["torchvision>=0.16", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["torchscope*"]

[tool.setuptools.package-data]
torchscope = ["viewer/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D"]
# SVG markup and caption sentences are long strings; splitting them hurts readability.
"torchscope/svg*.py" = ["E501"]
"torchscope/explain.py" = ["E501"]
